name: Deadman Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint the shell, the units and the example configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally. Ubuntu's
        # packaged shellcheck is a different version with different defaults,
        # so a tree that lints clean on a laptop can fail here for findings the
        # laptop never mentioned - which is a CI failure that teaches nothing.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 deadman.sh tests/e2e-deadman.sh
      - name: The shipped example configuration parses
        # A config file that does not parse installs cleanly and then checks
        # nothing, which is the failure this whole project exists to prevent.
        run: |
          mkdir -p /tmp/checks && cp checks.d/*.checks /tmp/checks/
          out="$(DEADMAN_CHECKS_DIR=/tmp/checks bash deadman.sh --list)"
          printf '%s\n' "$out"
          [ "$(printf '%s\n' "$out" | grep -c .)" -ge 10 ] \
            || { echo "::error::the example configuration parsed to almost nothing"; exit 1; }
      - name: The timer's schedule is real
        run: systemd-analyze verify deadman@.timer 2>&1 | grep -v 'Failed to prepare filename' || true

  scenarios:
    name: Twelve scenarios, each shown a real violation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run the end-to-end suite
        # Every check kind is given something that must fail it. A kind that
        # stays quiet fails the run: in a dead man's switch, a check that
        # cannot fail is worse than no check, because it makes the report
        # confident and wrong.
        run: |
          chmod +x tests/e2e-deadman.sh
          ./tests/e2e-deadman.sh
